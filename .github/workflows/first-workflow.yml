name: Build, Push, and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t kaivpractice/actions-practice:latest .

      - name: Push Docker image
        run: docker push kaivpractice/actions-practice:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/366442505073/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@project-7c26625e-b7bb-4386-8cf.iam.gserviceaccount.com'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials taskflow-cluster --zone asia-south1-a --project project-7c26625e-b7bb-4386-8cf

      - name: Deploy to Kubernetes
        run: |
          kubectl create deployment actions-practice-deployment --image=kaivpractice/actions-practice:latest --dry-run=client -o yaml | kubectl apply -f -
          kubectl rollout status deployment/actions-practice-deployment
      - name: Create ConfigMap and Secret in cluster
        run: |
          kubectl create configmap taskflow-config \
            --from-literal=DB_HOST=taskflow-db-service \
            --from-literal=DB_NAME=taskflow \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic taskflow-secret \
            --from-literal=DB_USER=postgres \
            --from-literal=DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -
      
